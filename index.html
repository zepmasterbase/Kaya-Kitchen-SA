<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaya Kitchen PRO | Order Food</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f6f6f6;
transition:0.3s;
}

/* DARK MODE */
body.dark{
background:#111;
color:#fff;
}

header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 18px;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
z-index:1000;
}

body.dark header{
background:rgba(0,0,0,0.7);
}

.logo{
font-weight:800;
font-size:18px;
}

.status{
font-size:12px;
padding:5px 10px;
border-radius:20px;
background:#25D366;
color:#fff;
}

/* HERO */
.hero{
height:60vh;
background:url('https://images.unsplash.com/photo-1555992336-03a23c7b20ee') center/cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
color:#fff;
}

.hero::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.hero-content{
position:relative;
text-align:center;
}

.hero h1{
font-size:34px;
}

.btn{
margin-top:10px;
padding:10px 20px;
background:#25D366;
border:none;
border-radius:30px;
color:#fff;
cursor:pointer;
}

/* CATEGORY SCROLL */
.cat-scroll{
display:flex;
overflow-x:auto;
gap:10px;
padding:12px;
background:#fff;
}

.cat{
padding:8px 14px;
background:#eee;
border-radius:20px;
white-space:nowrap;
font-size:13px;
}

/* MENU */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
padding:12px;
}

.card{
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 10px rgba(0,0,0,0.08);
}

.card img{
width:100%;
height:110px;
object-fit:cover;
}

.card-body{
padding:10px;
}

.price{
color:#25D366;
font-weight:bold;
}

.qty{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:8px;
}

.qty button{
padding:5px 10px;
border:none;
background:#111;
color:#fff;
border-radius:6px;
cursor:pointer;
}

/* CART BUTTON */
.cart-btn{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:14px;
border-radius:50px;
color:#fff;
font-weight:bold;
cursor:pointer;
}

/* CART PANEL */
.panel{
position:fixed;
right:-100%;
top:0;
width:320px;
height:100%;
background:#fff;
padding:15px;
transition:0.4s;
z-index:2000;
overflow:auto;
}

body.dark .panel{
background:#222;
}

.panel.active{
right:0;
}

.checkout{
background:#25D366;
color:#fff;
padding:12px;
border-radius:10px;
text-align:center;
margin-top:10px;
display:block;
}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:#fff;
padding:10px;
border-top:1px solid #ddd;
}

body.dark .bottom-nav{
background:#000;
}

/* DARK TOGGLE */
.toggle{
cursor:pointer;
padding:6px 10px;
border-radius:20px;
background:#111;
color:#fff;
font-size:12px;
}
</style>
</head>

<body>

<header>
<div class="logo">Kaya Kitchen</div>
<div style="display:flex; gap:10px; align-items:center;">
<div class="status" id="status">Checking...</div>
<div class="toggle" onclick="toggleDark()">Dark</div>
</div>
</header>

<!-- HERO -->
<div class="hero">
<div class="hero-content">
<h1>Order Food Like Uber Eats</h1>
<button class="btn" onclick="openCart()">View Cart</button>
</div>
</div>

<!-- CATEGORIES -->
<div class="cat-scroll">
<div class="cat">All</div>
<div class="cat">Chicken</div>
<div class="cat">Burgers</div>
<div class="cat">Pap Meals</div>
<div class="cat">Street Food</div>
</div>

<!-- MENU -->
<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d">
<div class="card-body">
<div>Grilled Chicken</div>
<div class="price">R60</div>
<div class="qty">
<button onclick="changeQty('Chicken',-1)">-</button>
<span id="Chicken">0</span>
<button onclick="changeQty('Chicken',1)">+</button>
</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544025162-d76694265947">
<div class="card-body">
<div>Pap & Beef</div>
<div class="price">R45</div>
<div class="qty">
<button onclick="changeQty('Pap',-1)">-</button>
<span id="Pap">0</span>
<button onclick="changeQty('Pap',1)">+</button>
</div>
</div>
</div>

</div>

<!-- CART BUTTON -->
<div class="cart-btn" onclick="openCart()">
🛒 <span id="count">0</span>
</div>

<!-- CART PANEL -->
<div class="panel" id="panel">
<h3>Your Order</h3>
<div id="list"></div>

<input id="address" placeholder="Enter delivery address" style="width:100%;padding:10px;margin-top:10px;">

<div style="margin-top:10px;">
<div>Food: R<span id="foodTotal">0</span></div>
<div>Delivery: R<span id="delivery">15</span></div>
<div><b>Total: R<span id="total">0</span></b></div>
</div>

<a class="checkout" id="wa" target="_blank">Checkout via WhatsApp</a>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<div>Home</div>
<div onclick="openCart()">Cart</div>
<div>Orders</div>
</div>

<script>

let cart = {};
let prices = {
Chicken:60,
Pap:45
};

function changeQty(item,val){
if(!cart[item]) cart[item]=0;
cart[item]+=val;
if(cart[item]<0) cart[item]=0;

document.getElementById(item).innerText=cart[item];
updateCart();
}

function updateCart(){
let list="";
let total=0;
let count=0;

for(let i in cart){
if(cart[i]>0){
list+=`${i} x${cart[i]}<br>`;
total+=cart[i]*prices[i];
count+=cart[i];
}
}

document.getElementById("list").innerHTML=list;
document.getElementById("count").innerText=count;

let delivery=15;
document.getElementById("foodTotal").innerText=total;
document.getElementById("delivery").innerText=delivery;
document.getElementById("total").innerText=total+delivery;

let msg="Hello Kaya Kitchen, I want:%0A"+list.replaceAll("<br>","%0A");

document.getElementById("wa").href=
"https://wa.me/27700000000?text="+msg;
}

function openCart(){
document.getElementById("panel").classList.toggle("active");
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function checkStatus(){
let h=new Date().getHours();
let status=document.getElementById("status");

if(h>=9 && h<=21){
status.innerText="OPEN";
status.style.background="#25D366";
}else{
status.innerText="CLOSED";
status.style.background="red";
}
}

checkStatus();

</script>

</body>
</html>
